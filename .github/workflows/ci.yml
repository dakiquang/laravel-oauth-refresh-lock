name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # monthly, catches new framework releases and advisories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every Laravel 10/11 release has security advisories without a fix, and Composer blocks them by
# default. Jobs on those lines ignore exactly the advisories listed in .github/legacy-advisories.json
# (still shown by `composer audit`); a new advisory turns them red on purpose. Laravel 12/13 jobs
# ignore nothing. This config only lives in CI, never in the package's composer.json.
env:
  INSTALL: |
    if [ "$LARAVEL" -lt 12 ]; then
      composer config --json policy.advisories.ignore-id "$(cat .github/legacy-advisories.json)"
    fi
    composer require "laravel/framework:^$LARAVEL.0" "orchestra/testbench:^$TESTBENCH.0" --dev --no-update --no-interaction
    composer update $COMPOSER_FLAGS --prefer-dist --no-interaction --no-progress
    composer audit || true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}${{ matrix.lowest && ' · lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 10/11: end of life, best-effort support.
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.1', laravel: '10', testbench: '8', lowest: true }
          - { php: '8.2', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '11', testbench: '9' }
          - { php: '8.3', laravel: '10', testbench: '8' }
          - { php: '8.3', laravel: '11', testbench: '9' }
          - { php: '8.4', laravel: '11', testbench: '9' }
          - { php: '8.2', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '13', testbench: '11' }
          - { php: '8.5', laravel: '12', testbench: '10' }
          - { php: '8.5', laravel: '13', testbench: '11' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite, pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          COMPOSER_FLAGS: ${{ matrix.lowest && '--prefer-lowest' || '' }}
        run: bash -ec "$INSTALL"

      - name: Run tests
        run: vendor/bin/phpunit

  static:
    name: PHPStan${{ matrix.pint && ' · Pint' || '' }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.4', laravel: '13', testbench: '11', pint: true }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: bash -ec "$INSTALL"

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pint
        if: matrix.pint
        run: vendor/bin/pint --test

  services:
    name: Concurrency · Redis + MySQL · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '10', testbench: '8' }
          - { php: '8.4', laravel: '13', testbench: '11' }
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix, redis, pdo_mysql
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: bash -ec "$INSTALL"

      - name: Concurrency suite on MySQL with database and Redis locks
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          OAUTH_TEST_MYSQL_HOST: 127.0.0.1
          OAUTH_TEST_MYSQL_USER: root
          OAUTH_TEST_MYSQL_PASSWORD: ci-only
          OAUTH_TEST_MYSQL_DATABASE: testing
        # Run it a few times: a race that shows up rarely must still fail the build.
        run: for i in 1 2 3; do vendor/bin/phpunit --testsuite Concurrency --fail-on-skipped || exit 1; done

  postgres:
    name: PostgreSQL · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '10', testbench: '8' }
          - { php: '8.4', laravel: '13', testbench: '11' }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: bash -ec "$INSTALL"

      - name: Store tests on PostgreSQL (upsert, version increment, compare-and-swap)
        env:
          OAUTH_TEST_PGSQL_HOST: 127.0.0.1
          OAUTH_TEST_PGSQL_USER: postgres
          OAUTH_TEST_PGSQL_PASSWORD: ci-only
          OAUTH_TEST_PGSQL_DATABASE: testing
        run: vendor/bin/phpunit --testsuite Feature
