name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # monthly, catches new framework releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '13', testbench: '11' }
          - { php: '8.5', laravel: '12', testbench: '10' }
          - { php: '8.5', laravel: '13', testbench: '11' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite, pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  static:
    name: PHPStan · Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  services:
    name: Concurrency · Redis + MySQL
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, redis, pdo_mysql
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Concurrency suite on MySQL with database and Redis locks
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          OAUTH_TEST_MYSQL_HOST: 127.0.0.1
          OAUTH_TEST_MYSQL_USER: root
          OAUTH_TEST_MYSQL_PASSWORD: ci-only
          OAUTH_TEST_MYSQL_DATABASE: testing
        # Run it a few times: a race that shows up rarely must still fail the build.
        run: for i in 1 2 3; do vendor/bin/phpunit --testsuite Concurrency --fail-on-skipped || exit 1; done
