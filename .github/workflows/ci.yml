name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 1 * *'  # monthly, catches new framework releases

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '11', testbench: '9' }
          - { php: '8.2', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '10', testbench: '8' }
          - { php: '8.3', laravel: '11', testbench: '9' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '11', testbench: '9' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '13', testbench: '11' }
          - { php: '8.5', laravel: '12', testbench: '10' }
          - { php: '8.5', laravel: '13', testbench: '11' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pdo_sqlite, pdo_mysql, redis
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  static:
    name: PHPStan · Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pint
        run: vendor/bin/pint --test
